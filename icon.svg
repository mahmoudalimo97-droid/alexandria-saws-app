<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#0F3B4C"/>
  <!-- Circular saw blade motif -->
  <g transform="translate(256, 230)">
    <circle r="140" fill="#1D6FB8" opacity="0.3"/>
    <circle r="120" fill="none" stroke="#F2A900" stroke-width="8" stroke-dasharray="24 12"/>
    <circle r="100" fill="#0F3B4C" stroke="#F2A900" stroke-width="6"/>
    <circle r="45" fill="#F2A900"/>
    <circle r="22" fill="#0F3B4C"/>
    <!-- Blade teeth accents -->
    <path d="M 0 -130 L 15 -100 L -15 -100 Z" fill="#F2A900"/>
    <path d="M 130 0 L 100 15 L 100 -15 Z" fill="#F2A900"/>
    <path d="M 0 130 L -15 100 L 15 100 Z" fill="#F2A900"/>
    <path d="M -130 0 L -100 -15 L -100 15 Z" fill="#F2A900"/>
    <path d="M 92 -92 L 65 -75 L 80 -60 Z" fill="#F2A900"/>
    <path d="M 92 92 L 75 65 L 60 80 Z" fill="#F2A900"/>
    <path d="M -92 92 L -65 75 L -80 60 Z" fill="#F2A900"/>
    <path d="M -92 -92 L -75 -65 L -60 -80 Z" fill="#F2A900"/>
  </g>
  <!-- Text in Arabic -->
  <text x="256" y="420" font-family="'Tajawal', sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" text-anchor="middle">الإسكندرية</text>
  <text x="256" y="465" font-family="'Tajawal', sans-serif" font-weight="600" font-size="24" fill="#F2A900" text-anchor="middle">كاتلوج الأسعار</text>
</svg>
