name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYSTORE_PASSWORD: 'android123'
  KEY_ALIAS: 'appkey'
  KEY_PASSWORD: 'android123'

jobs:
  build-apk:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            echo "Found package-lock.json. Running npm ci..."
            npm ci || { echo "npm ci failed due to mismatch. Falling back to npm install..."; npm install; }
          else
            echo "No package-lock.json found. Running npm install..."
            npm install
          fi

      - name: Build Web Application
        env:
          VITE_BASE: './'
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Ensure Android Platform and Assets
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found. Adding Android platform..."
            npx cap add android
          fi
          
          echo "Generating Android adaptive icons from resources/ using @capacitor/assets..."
          npx @capacitor/assets generate --android --iconBackgroundColor '#0B3A82' --iconBackgroundColorDark '#0B3A82'
          
          echo "Syncing Capacitor web assets into Android project..."
          npx cap sync android

      - name: Prepare Release Keystore (Fixed Secret or Fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding fixed release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          else
            echo "GitHub Secret KEYSTORE_BASE64 not configured. Generating keystore with fixed fallback credentials..."
            rm -f android/app/release.keystore
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias "${SECRET_ALIAS:-$KEY_ALIAS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${SECRET_STORE_PASS:-$KEYSTORE_PASSWORD}" \
              -keypass "${SECRET_KEY_PASS:-$KEY_PASSWORD}" \
              -dname "CN=Alexandria Sawmill, OU=App, O=Alexandria, L=Alexandria, S=Alexandria, C=EG"
          fi
          ls -la android/app/release.keystore

      - name: Configure Android Release Signing and Versioning
        run: node scripts/configure-signing.js
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || env.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Inspect Final Configuration Before Build
        run: |
          echo "=== Verifying Keystore File ==="
          ls -la android/app/release.keystore
          echo "=== Verifying android/app/build.gradle ==="
          cat android/app/build.gradle
          echo "=== Verifying android/app/signing.gradle ==="
          cat android/app/signing.gradle || true

      - name: Build Signed Android Release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --stacktrace --warning-mode none 2>&1 | tee ../gradle-build.log; exit ${PIPESTATUS[0]}

      - name: Show Gradle Error Summary
        if: always()
        run: |
          if [ -f "gradle-build.log" ]; then
            echo "=== Gradle Error Summary ==="
            grep -n -B3 -A20 -E "What went wrong|Execution failed|Caused by|error:|e: " gradle-build.log | head -120 || true
          fi

      - name: Print Context Before Stack Trace
        if: always()
        run: |
          if [ -f "gradle-build.log" ]; then
            echo "=== Searching First Stack Trace Line ==="
            grep -n -m1 "at org.gradle" gradle-build.log || true
            FIRST_LINE=$(grep -n -m1 "at org.gradle" gradle-build.log | cut -d: -f1)
            if [ -n "$FIRST_LINE" ] && [ "$FIRST_LINE" -gt 1 ]; then
              START_LINE=$((FIRST_LINE > 40 ? FIRST_LINE - 40 : 1))
              echo "=== 40 Lines Before Stack Trace (Lines $START_LINE to $FIRST_LINE) ==="
              sed -n "${START_LINE},${FIRST_LINE}p" gradle-build.log
            fi
          fi

      - name: Prepare and Rename Release APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Alexandria-Sawmill.apk
          ls -lh Alexandria-Sawmill.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alexandria-Sawmill-APK
          path: Alexandria-Sawmill.apk
          retention-days: 30

      - name: Publish Signed APK to GitHub Release (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release (Signed APK)"
          body: |
            ## 📱 تحميل تطبيق أندرويد الرسمي الموقّع (Signed Release APK)
            
            - **اسم التطبيق:** شركة الإسكندرية للمناشير (Alexandria Sawmill)
            - **اسم الملف:** `Alexandria-Sawmill.apk`
            - **رقم الإصدار (Version Code):** ${{ github.run_number }}
            - **نوع البناء:** إصدار موقّع رسمي (Signed Release APK)
            - **رابط التحميل الدائم:** متوفر دائماً من هذا الرابط الثابت.
            
            ### خطوات التثبيت:
            1. اضغط على `Alexandria-Sawmill.apk` أدناه للتحميل على هاتفك.
            2. افتح الملف واضغط **تثبيت (Install)**.
            3. إذا ظهر تنبيه أمني، فعّل **السماح من هذا المصدر (Allow from this source)**.
          draft: false
          prerelease: false
          make_latest: true
          files: Alexandria-Sawmill.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
