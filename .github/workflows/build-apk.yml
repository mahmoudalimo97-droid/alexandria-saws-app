name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "شركة الإسكندرية للمناشير - أحدث إصدار (Latest Release)"
          body: |
            ## 📱 تحميل أحدث نسخة من تطبيق أندرويد (APK)
            
            - **اسم التطبيق:** شركة الإسكندرية للمناشير
            - **اسم الملف:** `app-debug.apk`
            - **رابط التحميل المباشر الثابت:** دائماً من هذا الرابط الثابت.
            
            ### خطوات التثبيت:
            1. اضغط على `app-debug.apk` بالأسفل لتحميله على هاتفك.
            2. افتح الملف واضغط **تثبيت (Install)**.
            3. إذا ظهر تنبيه أمني، فعّل **السماح من هذا المصدر (Allow from this source)**.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
