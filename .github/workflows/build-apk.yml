name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Smart Dependencies Installation
        run: |
          if [ -f "package-lock.json" ]; then
            echo "Found package-lock.json. Running npm ci..."
            npm ci || { echo "npm ci failed due to mismatch. Falling back to npm install..."; npm install; }
          else
            echo "No package-lock.json found. Running npm install..."
            npm install
          fi

      - name: Build Web Application
        env:
          VITE_BASE: './'
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Fresh Android Platform Generation
        run: |
          echo "Removing any legacy android directory to ensure 100% clean generation..."
          rm -rf android
          echo "Adding fresh Android platform using Capacitor 8 CLI..."
          npx cap add android
          
          # Inject custom app icon if present in public folder
          if [ -f "public/icon.png" ]; then
            echo "Setting custom app icon for Android launcher..."
            find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp public/icon.png {} + || true
          fi
          
          echo "Syncing Capacitor web assets into Android project..."
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to GitHub Release (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest APK"
          body: |
            ## 📱 أحدث إصدار من تطبيق أندرويد (APK)
            
            - **اسم التطبيق:** شركة الإسكندرية للمناشير
            - **اسم الملف:** `app-debug.apk`
            - **رابط التحميل المباشر:** متوفر دائماً من هذا الإصدار.
            
            ### خطوات التثبيت:
            1. اضغط على `app-debug.apk` أدناه للتحميل على هاتفك.
            2. افتح الملف واضغط **تثبيت (Install)**.
            3. إذا ظهر تنبيه أمني، فعّل **السماح من هذا المصدر (Allow from this source)**.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
