name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Smart Dependencies Installation
        run: |
          if [ -f "package-lock.json" ]; then
            echo "package-lock.json found. Trying npm ci..."
            npm ci || { echo "npm ci failed due to lockfile mismatch. Falling back to npm install..."; npm install; }
          else
            echo "No package-lock.json found. Running npm install..."
            npm install
          fi

      - name: Build Web Application
        env:
          VITE_BASE: './'
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Ensure Android Platform and Sync
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found. Adding Android platform automatically..."
            npx cap add android
          fi
          echo "Syncing Capacitor with Android platform..."
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to GitHub Release (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest APK"
          body: |
            ## 📱 أحدث إصدار من تطبيق أندرويد (APK)
            
            - **اسم التطبيق:** شركة الإسكندرية للمناشير
            - **اسم الملف:** `app-debug.apk`
            - **رابط التحميل المباشر:** ثابت دائماً عبر هذا الإصدار.
            
            ### خطوات التثبيت:
            1. اضغط على `app-debug.apk` بالأسفل للتحميل على هاتفك.
            2. افتح الملف واضغط **تثبيت (Install)**.
            3. في حال ظهور تنبيه أمني، فعّل **السماح من هذا المصدر (Allow from this source)**.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
