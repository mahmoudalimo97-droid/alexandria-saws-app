name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: SPA Fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages (Auto-Enable if not configured)
        id: pages
        uses: actions/configure-pages@v4
        continue-on-error: true
        with:
          enablement: true

      - name: Upload artifact for GitHub Actions Pages
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './dist'

      - name: Deploy to GitHub Pages via Actions
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Fallback Deployment to gh-pages branch (if Pages is set to Branch mode)
        if: steps.deployment.outcome != 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
