name: CI/CD - Deploy Web & Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Build and Deploy Web App to GitHub Pages
  # ==========================================
  deploy-web:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Lint and Type Check
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: SPA Fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      # Attempt 1: Modern GitHub Pages via Actions
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v4
        continue-on-error: true
        with:
          enablement: true

      - name: Upload Pages Artifact
        id: upload-pages
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './dist'

      - name: Deploy Pages Deployment
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Attempt 2: Fallback to gh-pages branch (if Pages is set to Deploy from Branch)
      - name: Fallback Deploy to gh-pages Branch
        if: steps.deployment.outcome != 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

  # ==========================================
  # 2. Build Android APK & Upload Artifact
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

      - name: Prepare APK Outputs
        run: |
          mkdir -p release-apk
          # Locate and copy any built APK
          find android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} release-apk/ \;
          echo "=== Built APK Files ==="
          ls -la release-apk/
          if [ -f "release-apk/app-debug.apk" ]; then
            cp release-apk/app-debug.apk release-apk/Alexandria-Saws-v1.0-debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alexandria-Saws-Android-APK
          path: release-apk/*.apk
          retention-days: 30
          if-no-files-found: error
